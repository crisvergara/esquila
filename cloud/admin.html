<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; img-src 'self' data:; style-src 'unsafe-inline'; script-src 'self'; object-src 'none'; base-uri 'none'; frame-ancestors 'none'" />
  <title>Esquila — Dispositivos</title>
  <style>
    body { font-family: system-ui, sans-serif; background: #1a1a1a; color: #eee; max-width: 680px; margin: 0 auto; padding: 1rem; }
    header { display: flex; align-items: center; justify-content: space-between; gap: 1rem; }
    h1 { font-size: 1.3rem; }
    input, select, button { font-size: 1rem; padding: 0.5rem; border-radius: 6px; border: 1px solid #555; background: #2a2a2a; color: #eee; }
    button { cursor: pointer; background: #3a6ea5; border: none; }
    button.danger { background: #a53a3a; }
    button.quiet { background: #333; font-size: .85rem; }
    .row { display: flex; gap: 0.5rem; margin: 0.75rem 0; flex-wrap: wrap; align-items: center; }
    table { width: 100%; border-collapse: collapse; margin-top: 1rem; }
    td, th { text-align: left; padding: 0.4rem; border-bottom: 1px solid #333; font-size: 0.9rem; }
    #qr { margin-top: 1rem; text-align: center; }
    #qr img { background: #fff; padding: 8px; border-radius: 8px; max-width: 100%; }
    .token { font-family: monospace; word-break: break-all; font-size: 0.8rem; color: #9c9; }
    .muted { color: #aaa; font-size: 0.85rem; }
    .error { color: #ff8c8c; }
  </style>
</head>
<body>
  <header>
    <h1>Esquila — Dispositivos</h1>
    <button class="quiet" id="logout">Cerrar sesión</button>
  </header>
  <div class="row">
    <input id="name" maxlength="80" placeholder="Nombre (ej. Teléfono de Papá)" style="flex:1" />
    <select id="role">
      <option value="phone">teléfono</option>
      <option value="server">servidor</option>
    </select>
    <button id="create">Crear + QR</button>
  </div>
  <p id="error" class="error" role="alert"></p>
  <div id="qr"></div>
  <table>
    <thead><tr><th>Nombre</th><th>Rol</th><th>Visto</th><th></th></tr></thead>
    <tbody id="devices"></tbody>
  </table>
  <p class="muted">Los tokens solo se muestran una vez, al crear el dispositivo. Para revocar acceso, elimina el dispositivo.</p>
  <script src="/admin.js"></script>
</body>
</html>
