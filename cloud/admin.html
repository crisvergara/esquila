<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Esquila — Dispositivos</title>
  <style>
    body { font-family: system-ui, sans-serif; background: #1a1a1a; color: #eee; max-width: 640px; margin: 0 auto; padding: 1rem; }
    h1 { font-size: 1.3rem; }
    input, select, button { font-size: 1rem; padding: 0.5rem; border-radius: 6px; border: 1px solid #555; background: #2a2a2a; color: #eee; }
    button { cursor: pointer; background: #3a6ea5; border: none; }
    button.danger { background: #a53a3a; }
    .row { display: flex; gap: 0.5rem; margin: 0.75rem 0; flex-wrap: wrap; align-items: center; }
    table { width: 100%; border-collapse: collapse; margin-top: 1rem; }
    td, th { text-align: left; padding: 0.4rem; border-bottom: 1px solid #333; font-size: 0.9rem; }
    #qr { margin-top: 1rem; text-align: center; }
    #qr img { background: #fff; padding: 8px; border-radius: 8px; }
    .token { font-family: monospace; word-break: break-all; font-size: 0.8rem; color: #9c9; }
    .muted { color: #888; font-size: 0.85rem; }
  </style>
</head>
<body>
  <h1>Esquila — Dispositivos</h1>
  <div class="row">
    <input id="admintoken" type="password" placeholder="Admin token" style="flex:1" />
    <button onclick="saveToken()">Guardar</button>
  </div>
  <div class="row">
    <input id="name" placeholder="Nombre (ej. Teléfono de Papá)" style="flex:1" />
    <select id="role">
      <option value="phone">phone</option>
      <option value="server">server</option>
    </select>
    <button onclick="createDevice()">Crear + QR</button>
  </div>
  <div id="qr"></div>
  <table>
    <thead><tr><th>Nombre</th><th>Rol</th><th>Visto</th><th></th></tr></thead>
    <tbody id="devices"></tbody>
  </table>
  <p class="muted">Los tokens solo se muestran una vez, al crear el dispositivo. Para revocar acceso, elimina el dispositivo.</p>

  <script>
    const $ = (id) => document.getElementById(id);
    const token = () => localStorage.getItem("esquila_admin_token") ?? "";
    $("admintoken").value = token();

    function saveToken() {
      localStorage.setItem("esquila_admin_token", $("admintoken").value.trim());
      loadDevices();
    }

    async function api(method, path, body) {
      const res = await fetch(path, {
        method,
        headers: {
          "Authorization": "Bearer " + token(),
          ...(body ? { "Content-Type": "application/json" } : {}),
        },
        body: body ? JSON.stringify(body) : undefined,
      });
      if (!res.ok) throw new Error((await res.json().catch(() => ({}))).error ?? res.status);
      return res.json();
    }

    async function loadDevices() {
      try {
        const devices = await api("GET", "/api/admin/devices");
        $("devices").innerHTML = devices.map((d) => `
          <tr>
            <td>${d.name}</td><td>${d.role}</td>
            <td>${d.last_seen_at ? new Date(d.last_seen_at).toLocaleString("es-CL") : "nunca"}</td>
            <td><button class="danger" onclick="revoke('${d.id}')">Eliminar</button></td>
          </tr>`).join("");
      } catch (e) {
        $("devices").innerHTML = `<tr><td colspan="4" class="muted">${e.message}</td></tr>`;
      }
    }

    async function createDevice() {
      try {
        const d = await api("POST", "/api/admin/devices", {
          name: $("name").value,
          role: $("role").value,
        });
        $("qr").innerHTML = d.role === "server"
          ? `<p>Token para el servidor (variable CLOUD_SYNC_TOKEN):</p><p class="token">${d.token}</p>`
          : `<p>Escanéalo con el teléfono de <b>${d.name}</b>:</p><img src="${d.qrDataUrl}" alt="QR" />
             <p class="muted">o abre: <span class="token">${d.enrollUrl}</span></p>`;
        $("name").value = "";
        loadDevices();
      } catch (e) {
        alert(e.message);
      }
    }

    loadDevices();
  </script>
</body>
</html>
