<!doctype html>
<html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Esquila — Crear contraseña</title><style>*{box-sizing:border-box}body{margin:0;padding:1rem;background:#181c20;color:#f0f2f4;font:17px/1.5 system-ui,sans-serif}main{max-width:780px;margin:3vh auto;background:#242a30;padding:clamp(1rem,4vw,2rem);border-radius:14px}h1{line-height:1.2}h2{margin-top:2rem}a{color:#87ddff}label{display:block;margin:1rem 0 .35rem;font-weight:600}input,select,button{font:inherit;min-height:46px;border-radius:7px;padding:.65rem .8rem;max-width:100%}input,select{width:100%;border:1px solid #8495a4;background:#141a20;color:white}button{border:1px solid #648fbb;background:#245783;color:white;cursor:pointer;margin:.7rem .5rem .3rem 0}button:disabled{opacity:.6;cursor:wait}button.danger{background:#713434}button:focus-visible,a:focus-visible,input:focus-visible,select:focus-visible{outline:3px solid #ffc45b;outline-offset:3px}.notice{border-left:4px solid #ffc45b;padding:.6rem 1rem;background:#303640}.status{white-space:pre-wrap;min-height:1.5rem;color:#ffe0a3}.muted,small{color:#c3cbd2}.account{padding:1rem 0;border-bottom:1px solid #58616a;overflow-wrap:anywhere}.account p{margin:.2rem 0}nav{display:flex;gap:1rem;flex-wrap:wrap;align-items:center}[hidden]{display:none!important}details{margin:1.2rem 0}summary{cursor:pointer;padding:.6rem 0}</style></head><body><main><h1>Establecer tu contraseña</h1><p>Elige una frase única de 15 a 128 caracteres. Puedes usar un gestor de contraseñas.</p>
<form id="access-form"><label for="new-password">Nueva contraseña</label><input id="new-password" type="password" autocomplete="new-password" required maxlength="256"><label for="confirm-password">Repetir contraseña</label><input id="confirm-password" type="password" autocomplete="new-password" required maxlength="256"><button type="submit">Guardar contraseña</button></form>
<p id="access-status" class="status" role="status"></p><p><a href="/admin">Ir a iniciar sesión / solicitar otro enlace</a></p></main><script src="/admin-access.js" type="module"></script></body></html>
