name: Checks and delivery

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: pr-checks-${{ github.event.pull_request.number || github.ref }}
  # Cancel superseded PR checks, but let an active production deployment finish.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  application:
    name: Application and offline E2E
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: esquila_test
          POSTGRES_PASSWORD: esquila_test_password
          POSTGRES_DB: esquila_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U esquila_test -d esquila_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      CI: true
      TEST_DATABASE_URL: postgresql://esquila_test:esquila_test_password@127.0.0.1:5432/esquila_test
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            package-lock.json
            cloud/package-lock.json
      - run: npm ci
      - run: npm ci --prefix cloud
      - name: Audit production dependencies
        run: |
          npm audit --omit=dev --audit-level=high
          npm audit --prefix cloud --omit=dev --audit-level=high
      - run: npx playwright install --with-deps chromium
      - run: npm run check
      - name: Upload browser diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            playwright-report
            test-results
          retention-days: 7

  mac-installer:
    name: Apple Silicon installer
    runs-on: macos-14
    timeout-minutes: 20
    env:
      # electron-builder skips even ad-hoc signing for pull-request builds unless
      # this is set. This job uses identity "-" and receives no signing secrets.
      CSC_FOR_PULL_REQUEST: true
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build:mac:arm64
      - name: Verify installer and local-network entitlement metadata
        run: |
          file dist-mac/mac-arm64/Esquila.app/Contents/MacOS/Esquila | grep -q arm64
          codesign --verify --deep --strict dist-mac/mac-arm64/Esquila.app
          hdiutil verify dist-mac/Esquila-*-arm64.dmg
          test "$(/usr/libexec/PlistBuddy -c 'Print :NSBonjourServices:0' dist-mac/mac-arm64/Esquila.app/Contents/Info.plist)" = "_http._tcp"
          /usr/libexec/PlistBuddy -c 'Print :NSLocalNetworkUsageDescription' dist-mac/mac-arm64/Esquila.app/Contents/Info.plist | grep -q WiFi
      - name: Upload Apple Silicon installer
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/upload-artifact@v4
        with:
          name: Esquila-mac-arm64-${{ github.sha }}
          path: |
            dist-mac/Esquila-*-arm64.dmg
            dist-mac/Esquila-*-arm64.zip
          if-no-files-found: error
          retention-days: 30

  deploy:
    name: Deploy cloud to Fly.io
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [application, mac-installer]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - name: Install Fly CLI
        uses: superfly/flyctl-actions/setup-flyctl@ed8efb33836e8b2096c7fd3ba1c8afe303ebbff1
      - name: Deploy cloud service and PWA
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
        run: |
          if [ -z "$FLY_API_TOKEN" ]; then
            echo "::error::Set the repository Actions secret FLY_API_TOKEN to an app-scoped Fly deploy token."
            exit 1
          fi
          flyctl deploy --config fly.toml --remote-only --ha=false
      - name: Verify deployed service
        shell: bash
        run: |
          curl --fail --silent --show-error --retry 5 --retry-all-errors \
            --retry-delay 5 --max-time 30 --retry-max-time 180 \
            https://esquila-cloud.fly.dev/healthz | jq -e '.ok == true'
